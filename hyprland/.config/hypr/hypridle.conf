general {
    # lock.sh is the only thing that ever starts hyprlock, and it restarts it if
    # it dies while the session is still locked.
    lock_cmd = $HOME/.config/hypr/scripts/lock.sh
    # Makes `loginctl unlock-session` (from a TTY or over ssh) actually work:
    # hyprlock releases the session lock on SIGUSR1.
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    # Only after a real suspend, where the outputs come back powered down.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# The screen goes black through the fade shader, never through dpms. On this
# box (NVIDIA, four outputs, Hyprland 0.52.1) `dispatch dpms off` tears the
# outputs down, and waking them up again removes and re-adds the wl_output
# globals: every client still holding one gets a protocol error and is
# disconnected. That is what closed all the windows and killed hyprpaper --
# xdg-desktop-portal-hyprland even segfaulted in ~CCWlOutput. The shader only
# changes what is rendered, so nothing can be torn down behind the clients.
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/fade-to-black.sh
}

# The way back out lives in its own listener because hypridle drops on-resume
# while any inhibit is held (a browser or media player taking the dbus
# ScreenSaver / systemd idle inhibit while the screen is already black): the
# resume event was swallowed, fade-resume.sh never ran, and the shader stayed
# black for good. ignore_inhibit makes this one pure input-idle, so it is always
# idled whenever the fade is running and any input brings the screen back.
#
# The timeout is 1s, not 300s, because hypridle re-creates every idle timer
# from scratch when the last inhibit goes away while idled. With a long timeout
# that left a window where input arrived before the new timer had idled, so no
# resume event fired. At 1s the timer is idled again almost immediately. The
# catch is that fade-resume.sh now runs after every short pause, so it returns
# straight away when there is no fade to undo.
listener {
    timeout = 1
    ignore_inhibit = true
    on-resume = $HOME/.config/hypr/scripts/fade-resume.sh
}
