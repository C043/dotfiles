general {
    # Retry once: a single failed hyprlock used to leave the session on a black
    # ext-session-lock surface with no client to unlock it.
    lock_cmd = pidof hyprlock || hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/fade-to-black.sh
    on-resume = $HOME/.config/hypr/scripts/fade-resume.sh
}

# Backstop, independent of the fade scripts: if they ever fail to run, the
# outputs still power down and still come back on input.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
