cursor {
    no_warps = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 5
    col.active_border = rgba(88c0d0ee)
    col.inactive_border = rgba(504945aa)
    layout = dwindle
}

group {
    col.border_active = rgba(fe8019ee)
    col.border_inactive = rgba(504945aa)

    groupbar {
        col.active = rgba(fe8019ee)
        col.inactive = rgba(504945aa)
    }
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 6

    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
    }
}

animations {
    enabled = true
}

misc {
    # Let a fresh hyprlock take over an ext-session-lock whose client died.
    # Without this, scripts/lock.sh can restart hyprlock but Hyprland refuses
    # the new lock, and the session stays on the "lockscreen crashed" screen.
    allow_session_lock_restore = true
}
