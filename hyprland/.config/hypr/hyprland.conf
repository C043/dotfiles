$mod = SUPER
$terminal = kitty
$launcher = $HOME/.config/hypr/scripts/toggle-launcher.sh
$browser = $HOME/.config/hypr/scripts/open-browser.sh

# Monitor layout:
#           [ HDMI-A-1 up ]
# [ DP-2 sx ][ 2K central ][ DP-1 dx ]


monitor = DP-3, 2560x1440@240, 1920x1080, 1
monitor = HDMI-A-1, 1920x1080@60, 2240x0, 1
monitor = DP-2, 1920x1080@60, 0x1080, 1
monitor = DP-1, 1920x1080@60, 4480x1080, 1

workspace = 1, monitor:DP-2, default:true, persistent:true
workspace = 2, monitor:DP-3, default:true, persistent:true
workspace = 3, monitor:DP-1, default:true, persistent:true
workspace = 4, monitor:HDMI-A-1, default:true, persistent:true
workspace = 5, monitor:DP-2, persistent:true
workspace = 6, monitor:DP-3, persistent:true
workspace = 7, monitor:DP-1, persistent:true
workspace = 8, monitor:HDMI-A-1, persistent:true

exec-once = hyprpaper
exec-once = waybar -c $HOME/.config/hypr/waybar/config.jsonc -s $HOME/.config/hypr/waybar/style.css
exec-once = mako --config $HOME/.config/hypr/mako/config
exec-once = swayosd-server
exec-once = hypridle

env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita:dark

cursor {
    default_monitor = DP-3
    no_warps = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 5
    col.active_border = rgba(88c0d0ee)
    col.inactive_border = rgba(504945aa)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

input {
    kb_layout = it

    touchpad {
        natural_scroll = true
    }
}

bind = $mod, t, exec, $terminal
bindr = SUPER, SUPER_L, exec, $launcher
bindr = SUPER, SUPER_R, exec, $launcher
bind = $mod, b, exec, $browser
bind = $mod, i, exec, /run/media/c043/Drive/EPICODE/c043-scripts/nvim-anywhere.sh
bind = $mod, n, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mod, BackSpace, exec, hyprlock
bind = $mod, Escape, exec, hyprlock
bind = $mod, q, killactive
bind = $mod SHIFT, E, exit
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mod, H, exec, ~/.config/hypr/scripts/movefocus-warp.sh l
bind = $mod, L, exec, ~/.config/hypr/scripts/movefocus-warp.sh r
bind = $mod, K, exec, ~/.config/hypr/scripts/movefocus-warp.sh u
bind = $mod, J, exec, ~/.config/hypr/scripts/movefocus-warp.sh d

bind = $mod, left, exec, ~/.config/hypr/scripts/movefocus-warp.sh l
bind = $mod, right, exec, ~/.config/hypr/scripts/movefocus-warp.sh r
bind = $mod, up, exec, ~/.config/hypr/scripts/movefocus-warp.sh u
bind = $mod, down, exec, ~/.config/hypr/scripts/movefocus-warp.sh d

bind = $mod SHIFT, H, movewindoworgroup, l
bind = $mod SHIFT, L, movewindoworgroup, r
bind = $mod SHIFT, K, movewindoworgroup, u
bind = $mod SHIFT, J, movewindoworgroup, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

bind = $mod CTRL, L, workspace, m+1
bind = $mod CTRL, H, workspace, m-1
bind = $mod SHIFT CTRL, L, movetoworkspace, m+1
bind = $mod SHIFT CTRL, H, movetoworkspace, m-1

bind = $mod ALT, H, focusmonitor, l
bind = $mod ALT, L, focusmonitor, r
bind = $mod ALT, K, focusmonitor, u
bind = $mod ALT, J, focusmonitor, d

bind = $mod ALT, left, focusmonitor, l
bind = $mod ALT, right, focusmonitor, r
bind = $mod ALT, up, focusmonitor, u
bind = $mod ALT, down, focusmonitor, d

bind = $mod SHIFT ALT, H, movewindow, mon:l
bind = $mod SHIFT ALT, L, movewindow, mon:r
bind = $mod SHIFT ALT, K, movewindow, mon:u
bind = $mod SHIFT ALT, J, movewindow, mon:d

bind = $mod SHIFT ALT, left, movewindow, mon:l
bind = $mod SHIFT ALT, right, movewindow, mon:r
bind = $mod SHIFT ALT, up, movewindow, mon:u
bind = $mod SHIFT ALT, down, movewindow, mon:d

bind = $mod, m, fullscreen
bind = $mod SHIFT, Space, togglefloating

bind = $mod, o, exec, hyprctl dispatch layoutmsg togglesplit
bind = $mod, s, togglegroup
bind = ALT CTRL, h, changegroupactive, b
bind = ALT CTRL, l, changegroupactive, f

bind = $mod SHIFT, n, exec, $HOME/.config/hypr/scripts/toggle-dnd.sh

bind = SHIFT ALT CTRL, R, exec, hyprshot -m region
